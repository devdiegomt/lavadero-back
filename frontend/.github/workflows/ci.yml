# Integración continua del panel.
#
# El trabajo real de este archivo es el segundo job: **correr las pruebas en
# Firefox y en WebKit**, que es lo que no se pudo hacer en ninguna máquina hasta
# ahora. Acá los binarios se descargan sin pelear con ninguna red.
#
# WebKit importa más que los otros dos: es el motor de Safari y el más
# restrictivo con cookies. Toda la sesión del panel vive en una cookie
# `httpOnly`, así que si algo se va a romper, se rompe ahí — y el dueño de un
# lavadero mirando el tablero desde un iPhone es el caso normal, no el raro.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tipos:
    name: Tipos y build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  navegadores:
    # **Un runner por navegador**, no los cinco en el mismo. Corriéndolos juntos,
    # dos veces seguidas el backend se quedó sin conexiones a mitad del cuarto
    # proyecto y las 36 pruebas siguientes ni se ejecutaron — o sea que un fallo
    # de WebKit quedaba enterrado bajo un backend muerto.
    #
    # Separados: cada navegador tiene su backend y su base, un fallo no arrastra
    # a los demás, y el informe dice cuál de los cinco falló sin tener que
    # deducirlo. Además corren en paralelo, así que tarda menos.
    name: ${{ matrix.navegador }}
    runs-on: ubuntu-latest
    strategy:
      # Que uno falle no cancela a los otros: si WebKit encuentra algo, se
      # quiere ver igual si Firefox pasó.
      fail-fast: false
      matrix:
        navegador: [escritorio, móvil, firefox, safari, safari-móvil]

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: carwash_ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/carwash_ci
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-solo-para-pruebas-no-sirve-en-ningun-otro-lado-0123456789
      ENCRYPTION_KEY: 00112233445566778899aabbccddeeff00112233445566778899aabbccddeeff
      SUPER_ADMIN_EMAIL: superadmin@ci.local
      SUPER_ADMIN_PASSWORD: ci-super-password
      TENANT_PHONE: '+573001234567'
      N8N_API_KEY: ci-n8n-key
      BOT_WA_SEND_TOKEN: ci-bot-token
      CORS_ORIGIN: http://localhost:5173

    steps:
      - name: El panel
        uses: actions/checkout@v4

      # Las pruebas necesitan un backend de verdad: la sesión en cookie no se
      # puede probar contra un mock, que es la razón de que esta suite exista.
      # Los dos repositorios son públicos, así que esto no necesita token.
      - name: El backend
        uses: actions/checkout@v4
        with:
          repository: devdiegomt/lavadero-back
          path: backend

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Dependencias del backend
        working-directory: backend
        run: npm ci

      - name: Migraciones y datos
        working-directory: backend
        env:
          DB_APP_PASSWORD: ci_app_password
        run: npm run db:reset

      # `NODE_ENV=development` a propósito: con `test` el servidor **no abre el
      # puerto** —`index.ts` lo saltea para que supertest use `app` directo— y
      # las pruebas se quedarían esperando a algo que nunca escucha.
      #
      # Y los límites arriba: la prueba de la contraseña equivocada gasta un
      # intento por navegador, y son cinco.
      - name: Levantar el backend
        working-directory: backend
        env:
          NODE_ENV: development
          RATE_LIMIT_MAX: '100000'
          STRICT_RATE_LIMIT_MAX: '1000'
        run: |
          npx ts-node --transpile-only src/index.ts > /tmp/backend.log 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "backend arriba"; exit 0
            fi
            sleep 2
          done
          echo "El backend no respondió en 80 s:"; cat /tmp/backend.log; exit 1

      - name: Dependencias del panel
        run: npm ci

      # Sólo el motor de este job: bajar los tres en cada uno de los cinco
      # runners es tiempo y ancho de banda por nada. `--with-deps` instala las
      # librerías de sistema que Firefox y WebKit necesitan en Ubuntu; sin eso
      # los binarios están y no arrancan.
      - name: El navegador de este job
        run: |
          case "${{ matrix.navegador }}" in
            firefox) motor=firefox ;;
            safari|safari-móvil) motor=webkit ;;
            *) motor=chromium ;;
          esac
          npx playwright install --with-deps "$motor"

      - name: Pruebas
        env:
          NAVEGADORES: ${{ matrix.navegador }}
        run: npm run e2e

      # Cuando la suite falla, lo que hace falta no es el fallo de Playwright
      # —ése ya se ve— sino **el estado del backend en ese momento**. Las tres
      # preguntas que separan las causas posibles, en un paso:
      #
      #   1. ¿El proceso sigue vivo, o se murió?
      #   2. ¿Qué dijo el log? Un `pool.connect()` agotado, una base caída y un
      #      proceso muerto se ven distinto y se arreglan distinto.
      #   3. ¿Cómo están las conexiones? Diez `idle` es un pool sano; diez
      #      `active` o `idle in transaction` es una fuga.
      #
      # Sin esto un fallo obliga a adivinar, y adivinar ya costó tres hipótesis
      # falsas en este mismo problema.
      - name: Qué le pasó al backend
        if: failure()
        run: |
          echo "=== ¿sigue vivo? ==="
          pgrep -af "ts-node" || echo "NO: el proceso ya no está"
          echo
          echo "=== conexiones a PostgreSQL ==="
          PGPASSWORD=postgres psql -h localhost -U postgres -d carwash_ci -c \
            "SELECT state, count(*), max(now() - state_change) AS mas_vieja
               FROM pg_stat_activity
              WHERE datname='carwash_ci' AND application_name <> 'psql'
              GROUP BY state" || echo "no se pudo consultar la base"
          echo
          echo "=== memoria y carga ==="
          free -m || true
          uptime || true
          echo
          echo "=== log del backend, últimas 200 líneas ==="
          tail -200 /tmp/backend.log

      # Y entero como artefacto: 200 líneas no siempre alcanzan, y es lo primero
      # que hace falta para diagnosticar.
      - name: Log del backend, completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: backend-log-${{ matrix.navegador }}
          path: /tmp/backend.log
          retention-days: 7

      - name: Informe
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.navegador }}
          path: playwright-report/
          retention-days: 7
